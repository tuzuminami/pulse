name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test, and boundary scan
        run: pnpm run check

      - name: Verify VEIL v1 receipt contract
        run: pnpm run check:veil-contract

      - name: Monitor VEIL receipt compatibility
        env:
          VEIL_RECEIPT_SCHEMA_URL: https://raw.githubusercontent.com/tuzuminami/veil/main/schemas/decision-receipt.schema.json
        run: pnpm run check:veil-contract

      - name: Verify package contents
        run: npm pack --dry-run --cache /tmp/pulse-npm-cache

name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing pushed release tag with a matching draft release to build and attest before publication.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test, and boundary scan
        run: pnpm run check

      - name: Verify VEIL v1 receipt contract
        run: pnpm run check:veil-contract

      - name: Monitor VEIL receipt compatibility
        env:
          VEIL_RECEIPT_SCHEMA_URL: https://raw.githubusercontent.com/tuzuminami/veil/main/schemas/decision-receipt.schema.json
        run: pnpm run check:veil-contract

      - name: Verify package contents
        run: npm pack --dry-run --cache /tmp/pulse-npm-cache

  release-evidence:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Confirm immutable-release draft boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"

      - name: Confirm release tag was pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')" = "tag"

      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Verify release tag identity
        run: |
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        run: |
          mkdir -p release-artifacts
          set -o pipefail
          pnpm run check | tee release-artifacts/verification.log
          pnpm run check:veil-contract | tee -a release-artifacts/verification.log

      - name: Build release tarball
        run: mkdir -p release-artifacts && npm pack --pack-destination release-artifacts --json

      - name: Generate CycloneDX SBOM
        run: node scripts/generate-sbom.mjs

      - name: Generate synthetic release evaluation
        run: node scripts/generate-release-evaluation.mjs --release-source "$GITHUB_WORKSPACE"

      - name: Include release evidence verifier
        run: cp scripts/verify-release-evidence.mjs release-artifacts/verify-release-evidence.mjs

      - name: Generate release decision manifest
        run: node scripts/generate-release-evidence.mjs --release-source "$GITHUB_WORKSPACE" --release-tag "$RELEASE_TAG" --pnpm-version "$(pnpm --version)"

      - name: Verify release decision bundle
        run: node scripts/verify-release-evidence.mjs --artifact-dir release-artifacts

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-release-evidence-${{ inputs.release_tag }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Attest release package provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-artifacts/*.tgz
          create-storage-record: false

      - name: Attest release package SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-artifacts/*.tgz
          sbom-path: release-artifacts/pulse-sbom.cdx.json
          create-storage-record: false

      - name: Attest release decision manifest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-artifacts/pulse-release-decision.json
          create-storage-record: false

      - name: Attach immutable audit bundle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-artifacts/*.tgz release-artifacts/pulse-sbom.cdx.json release-artifacts/pulse-release-evaluation.json release-artifacts/pulse-release-decision.json release-artifacts/verification.log release-artifacts/verify-release-evidence.mjs

  verify-published-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PULSE_RELEASE_TAG: ${{ github.event.release.tag_name }}
      PULSE_RELEASE_ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
      PULSE_RELEASE_IS_IMMUTABLE: ${{ github.event.release.immutable }}
    steps:
      - name: Checkout released tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Verify public release evidence as a consumer
        run: node scripts/verify-published-release.mjs
